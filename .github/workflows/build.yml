name: Build map packs

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Geofabrik regions, comma-separated
        default: >-
          europe/germany,europe/austria,europe/switzerland,europe/liechtenstein,
          europe/netherlands,europe/belgium,europe/luxembourg,europe/denmark

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.split.outputs.regions }}
    steps:
      - id: split
        env:
          REGIONS: ${{ inputs.regions }}
        run: echo "regions=$(jq -cR 'gsub("\\s"; "") | split(",")' <<< "$REGIONS")" >> "$GITHUB_OUTPUT"
      - name: Create the "maps" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view maps || gh release create maps --title "Map packs" \
            --notes "Open on your phone, download a region, then open it with Kiesel."

  packs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - name: Free disk space for country extracts
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build ${{ matrix.region }}
        env:
          REGION: ${{ matrix.region }}
        run: gradle :core:buildPacks -Pregions="$REGION"
      - name: Upload to the "maps" release, replacing parts from earlier builds
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ matrix.region }}
        run: |
          gh release upload maps build/packs/*.zip --clobber
          name=$(basename "$REGION")
          gh release view maps --json assets --jq '.assets[].name' \
            | grep -E "^kiesel-$name(-[0-9]+of[0-9]+)?\.zip$" \
            | while read -r asset; do
                [ -f "build/packs/$asset" ] || gh release delete-asset maps "$asset" --yes
              done
