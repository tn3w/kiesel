name: Build map packs

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Geofabrik regions, comma-separated
        default: europe/liechtenstein,europe/switzerland

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build packs
        run: gradle :core:buildPacks -Pregions=${{ inputs.regions }}
      - name: Publish to the "maps" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps || gh release create maps --title "Map packs" \
            --notes "Open on your phone, download a region, then open it with Kiesel."
          gh release upload maps build/packs/*.zip --clobber
